<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#2563eb" />
<title>Project Cards</title>
<style>
:root{--bg:#f4f7fb;--surface:#fff;--surface2:#eef3f9;--text:#172033;--muted:#687386;--line:#dce3ec;--brand:#2563eb;--shadow:0 10px 30px rgba(20,35,70,.09);--radius:18px}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit}
a{color:var(--brand)}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) clamp(14px,4vw,42px) 14px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer;color:var(--text)}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#2563eb,#7c3aed);display:grid;place-items:center;color:#fff;flex:0 0 auto}
.top-spacer{flex:1}
.icon-btn,.btn{border:0;border-radius:11px;cursor:pointer;transition:.18s}
.icon-btn{width:40px;height:40px;background:var(--surface2);color:var(--text);font-size:18px;flex:0 0 auto}
.icon-btn.home{background:var(--brand);color:#fff;font-size:21px}
.icon-btn:hover,.btn:hover{filter:brightness(.97)}
.btn{padding:10px 15px;font-weight:700;background:var(--brand);color:#fff}
.btn.secondary{background:var(--surface2);color:var(--text)}
.btn.danger{background:#fee2e2;color:#991b1b}
.btn.small{padding:7px 10px;font-size:13px}
.btn.block{width:100%;padding:13px}
.container{max-width:1200px;margin:auto;padding:28px clamp(16px,4vw,42px) calc(60px + env(safe-area-inset-bottom))}
.syncbar{display:flex;align-items:center;gap:10px;justify-content:center;padding:8px 16px;font-size:13px;font-weight:600;background:#eef3f9;color:var(--muted);border-bottom:1px solid var(--line)}
.syncbar.warn{background:#fef3c7;color:#92400e}
.syncbar.err{background:#fee2e2;color:#991b1b}
.syncbar.ok{background:#dcfce7;color:#166534}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto}
.breadcrumb{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);margin-bottom:18px;flex-wrap:wrap}
.crumb{background:none;border:0;padding:0;color:var(--brand);cursor:pointer;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb.here{color:var(--muted);cursor:default}
.hero{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}
.eyebrow{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);font-weight:800}
.hero h1{margin:4px 0 7px;font-size:clamp(27px,5vw,42px);line-height:1.08;word-break:break-word}
.hero p{margin:0;color:var(--muted);max-width:650px}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);padding:16px;border-radius:16px}
.stat .n{font-size:25px;font-weight:800}
.stat .l{color:var(--muted);font-size:13px;margin-top:2px}
.toolbar{display:flex;gap:10px;margin:0 0 18px}
.search{flex:1;position:relative}
.search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:12px;background:var(--surface);outline:none}
.search:before{content:'\2315';position:absolute;left:14px;top:8px;font-size:21px;color:var(--muted)}
select{padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}
.section-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;margin-bottom:22px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:.2s;overflow:hidden}
.card:hover{transform:translateY(-3px);border-color:#b8c7dc}
.card:before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--accent,var(--brand))}
.card-head{display:flex;align-items:start;gap:12px}
.card-icon{width:44px;height:44px;border-radius:13px;background:color-mix(in srgb,var(--accent,var(--brand)) 13%,white);color:var(--accent,var(--brand));display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.card-title{font-size:18px;font-weight:800;margin:0;word-break:break-word}
.desc{color:var(--muted);font-size:14px;margin:5px 0 0;min-height:21px}
.menu{margin-left:auto;border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--muted);padding:0 4px}
.progress-row{display:flex;justify-content:space-between;font-size:13px;margin-top:20px}
.progress{height:8px;background:#e7ebf2;border-radius:99px;overflow:hidden;margin-top:7px}
.progress>span{display:block;height:100%;border-radius:99px;background:var(--accent,var(--brand));transition:.3s}
.metrics{display:flex;gap:12px;margin-top:18px;padding-top:15px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);flex-wrap:wrap}
.metric strong{color:var(--text)}
.empty{text-align:center;background:var(--surface);border:2px dashed var(--line);border-radius:var(--radius);padding:48px 20px}
.empty-icon{font-size:38px}
.empty h3{margin:8px 0}
.empty p{color:var(--muted);margin:0 0 18px}
.list{display:grid;gap:11px;margin-bottom:22px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px 15px}
.item.has-kids{border-left:4px solid var(--accent,var(--brand))}
.check{width:23px;height:23px;accent-color:var(--brand);cursor:pointer;flex:0 0 auto}
.item-main{min-width:0;cursor:pointer}
.item-title{font-weight:750;word-break:break-word}
.item.done .item-title{text-decoration:line-through;color:var(--muted)}
.item-meta{font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{background:var(--surface2);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;color:var(--muted)}
.item-actions{display:flex;gap:6px;align-items:center}
.price{font-weight:800;white-space:nowrap}
.linkbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--surface2);text-decoration:none;font-size:15px}
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.48);display:none;align-items:center;justify-content:center;padding:18px}
.modal-backdrop.open{display:flex}
.modal{width:min(540px,100%);max-height:88vh;overflow:auto;background:var(--surface);border-radius:20px;padding:23px;box-shadow:0 25px 80px rgba(0,0,0,.25)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal h2{margin:0;font-size:21px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field.full{grid-column:1/-1}
.field label{display:block;font-size:13px;font-weight:750;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:none;background:#fff}
.field textarea{min-height:76px;resize:vertical}
.typepick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.typepick button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 6px;cursor:pointer;text-align:center;font-weight:700;font-size:13px;color:var(--muted)}
.typepick button .ic{display:block;font-size:19px;margin-bottom:3px}
.typepick button.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,white);color:var(--brand)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,15px);z-index:200;background:#172033;color:#fff;padding:12px 18px;border-radius:11px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
.accent-picker{display:flex;gap:8px;flex-wrap:wrap}
.accent-dot{width:28px;height:28px;border-radius:50%;border:3px solid #fff;outline:1px solid var(--line);cursor:pointer}
.accent-dot.selected{outline:3px solid #111827}
.danger-zone{margin-top:25px;padding-top:20px;border-top:1px solid var(--line)}
.auth-wrap{min-height:70vh;display:grid;place-items:center;padding:20px}
.auth-card{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}
.auth-card h1{margin:12px 0 6px;font-size:26px}
.auth-card p.sub{margin:0 0 22px;color:var(--muted)}
.auth-tabs{display:flex;gap:6px;background:var(--surface2);padding:5px;border-radius:12px;margin-bottom:18px}
.auth-tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.auth-tabs button.active{background:#fff;color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.07)}
.note{font-size:13px;color:var(--muted);margin-top:16px;line-height:1.5}
.snaps{display:grid;gap:8px;margin-top:14px;max-height:46vh;overflow:auto}
.snap{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.snap-info{flex:1;min-width:0}
.snap-when{font-weight:750;font-size:14px}
.snap-meta{font-size:12px;color:var(--muted);margin-top:2px}
.snap-tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--brand)}

@media(max-width:820px){
.stats{gap:10px;margin-bottom:18px}
.stat{padding:13px}
.stat .n{font-size:22px}
}

/* phone: compact single-row summary strip */
@media(max-width:600px){
.stats{display:flex;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:15px}
.stat{flex:1 1 0;min-width:0;background:transparent;border:0;border-right:1px solid var(--line);border-radius:0;padding:9px 5px;text-align:center}
.stat:last-child{border-right:0}
.stat .n{font-size:16px;line-height:1.2;letter-spacing:-.02em}
.stat .l{font-size:10px;margin-top:1px;line-height:1.25;text-transform:uppercase;letter-spacing:.02em}
.container{padding-top:18px}
.hero{margin-bottom:16px}
.hero h1{font-size:24px}
.hero p{font-size:14px}
.breadcrumb{margin-bottom:12px;font-size:13px}
.brand span.txt{display:none}
.typepick{grid-template-columns:1fr}
.typepick button{display:flex;align-items:center;gap:9px;text-align:left}
.typepick button .ic{margin:0;font-size:17px}
}

@media(max-width:700px){
.hero{align-items:stretch;flex-direction:column}
.hero-actions .btn{flex:1}
.topbar .btn-label{display:none}
.toolbar{flex-wrap:wrap}
.toolbar .search{flex-basis:100%}
.form-grid{grid-template-columns:1fr}
.field.full{grid-column:auto}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="icon-btn home" id="homeBtn" title="Home" onclick="goHome()">&#8962;</button>
  <button class="brand" title="Home" onclick="goHome()"><span class="logo">&#9670;</span><span class="txt">Project Cards</span></button>
  <div class="top-spacer"></div>
  <button class="icon-btn" title="Export backup" onclick="exportData()">&#8681;</button>
  <button class="icon-btn" title="Import backup" onclick="document.getElementById('importFile').click()">&#8679;</button>
  <input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)">
  <button class="icon-btn" id="accountBtn" title="Account" onclick="openAccountModal()">&#9675;</button>
  <button class="btn" onclick="openNodeModal(null,'folder')">&#65291; <span class="btn-label" id="topAddLabel">New</span></button>
</header>
<div class="syncbar hidden" id="syncbar"><span class="dot"></span><span id="syncText"></span></div>
<main class="container" id="main"></main>
<div class="modal-backdrop" id="modalBackdrop" onclick="backdropClose(event)"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* =====================================================================
   CONFIGURATION - Supabase project
   ===================================================================== */
const SUPABASE_URL      = "https://zmnfyngcdnkunapfdwrl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_zNvssY0xOy1_oRNcUXWnOA_sCjRp_hy";
/* ===================================================================== */

const LOCAL_KEY = 'projectCards.v2';
const SNAP_KEY  = 'projectCards.snapshots';
const MAX_SNAPS = 20;
const colors = ['#2563eb','#7c3aed','#db2777','#d97706','#16a34a','#0891b2','#dc2626'];
const cloudEnabled = Boolean(SUPABASE_URL && SUPABASE_ANON_KEY);
let sb = null, session = null, channel = null, pushTimer = null, pulling = false;

/* ---------------------------------------------------------------------
   DATA MODEL
   Every card is a "node" and every node may contain children, so a
   project, a list, a task and a part are all the same shape. Nesting
   depth is unlimited.

     node = { id, type:'folder'|'task'|'part', name, description, color,
              done, qty, price, url, children:[ node, ... ] }
--------------------------------------------------------------------- */
let state = { updatedAt: 0, nodes: [] };
let route = { path: [] };          // array of node ids, root = []
let query = '', authTab = 'signin', itemFilter = 'all';

/* ---------------------- helpers ---------------------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>'"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]; }); }
function money(n){ return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0); }
function kids(n){ return (n && n.children) || []; }
function isFolder(n){ return n.type === 'folder'; }
function isPart(n){ return n.type === 'part'; }

/* Only http(s) links are allowed through, so a stored value can never
   become a javascript: URL when rendered. */
function safeUrl(u){
  var t = String(u == null ? '' : u).trim();
  if (!t) return '';
  if (/^https?:\/\//i.test(t)) return t;
  if (/^[\w.-]+\.[a-z]{2,}([\/?#]|$)/i.test(t)) return 'https://' + t;
  return '';
}
function hostOf(u){
  var m = /^https?:\/\/([^\/?#]+)/i.exec(u);
  return m ? m[1].replace(/^www\./i,'') : 'link';
}

/* ---------------------- recursive rollups ---------------------- */
function walk(n, fn){ fn(n); kids(n).forEach(function(c){ walk(c, fn); }); }
function leafStats(node){
  var total = 0, done = 0, cost = 0, parts = 0;
  kids(node).forEach(function(c){
    walk(c, function(x){
      if (!isFolder(x)){
        total++; if (x.done) done++;
        if (isPart(x)){ parts++; cost += (Number(x.qty)||1) * (Number(x.price)||0); }
      }
    });
  });
  return { total: total, done: done, open: total - done, cost: cost, parts: parts,
           pct: total ? Math.round(done / total * 100) : 0 };
}
function descendantCount(node){ var c = 0; kids(node).forEach(function(k){ walk(k, function(){ c++; }); }); return c; }
function lineTotal(n){ return (Number(n.qty)||1) * (Number(n.price)||0); }

/* ---------------------- tree navigation ---------------------- */
/* The virtual root exposes state.nodes directly, so pushing to
   container.children works identically at every level. */
function rootContainer(){ return { id:'', root:true, type:'folder', name:'Your projects', children: state.nodes, color: colors[0] }; }
function nodeAt(path){
  var cur = rootContainer();
  for (var i = 0; i < path.length; i++){
    var next = kids(cur).find(function(c){ return c.id === path[i]; });
    if (!next) return null;
    cur = next;
  }
  return cur;
}
function current(){ return nodeAt(route.path); }
function parentOfCurrent(){ return nodeAt(route.path.slice(0, -1)); }
function trail(){
  var out = [], cur = rootContainer();
  for (var i = 0; i < route.path.length; i++){
    var next = kids(cur).find(function(c){ return c.id === route.path[i]; });
    if (!next) break;
    out.push({ node: next, path: route.path.slice(0, i + 1) });
    cur = next;
  }
  return out;
}
function findParentOf(id, container){
  container = container || rootContainer();
  if (kids(container).some(function(c){ return c.id === id; })) return container;
  for (var i = 0; i < kids(container).length; i++){
    var hit = findParentOf(id, kids(container)[i]);
    if (hit) return hit;
  }
  return null;
}

/* ---------------------- seed + migration ---------------------- */
function seed(){
  return { updatedAt: 0, seeded: true, nodes: [
    { id: uid(), type:'folder', name:'Workshop Upgrade', description:'Sample project - edit or delete it', color:'#2563eb', children: [
      { id: uid(), type:'folder', name:'Tasks', description:'Work to complete', color:'#7c3aed', children: [
        { id: uid(), type:'task', name:'Measure available bench space', done:true,  notes:'', children: [] },
        { id: uid(), type:'task', name:'Finalize layout', done:false, notes:'Check outlet locations', children: [
          { id: uid(), type:'task', name:'Confirm outlet height', done:false, notes:'', children: [] }
        ]}
      ]},
      { id: uid(), type:'folder', name:'Parts to Buy', description:'Materials to purchase', color:'#16a34a', children: [
        { id: uid(), type:'part', name:'M8 mounting bolts', done:false, qty:12, price:1.25, url:'', notes:'Zinc plated', children: [] },
        { id: uid(), type:'part', name:'Cable tray', done:true, qty:2, price:28, url:'', notes:'', children: [] }
      ]}
    ]}
  ]};
}

/* Converts the old project -> category -> item shape into the unified
   node tree. Runs once; anything already in node form passes through. */
function migrate(raw){
  if (!raw || typeof raw !== 'object') return null;
  if (Array.isArray(raw.nodes)) return normalize(raw);
  if (!Array.isArray(raw.projects)) return null;
  var nodes = raw.projects.map(function(p){
    return {
      id: p.id || uid(), type:'folder', name: p.name || 'Untitled',
      description: p.description || '', color: p.color || colors[0], children:
      (p.categories||[]).map(function(c){
        var childType = c.type === 'parts' ? 'part' : 'task';
        return {
          id: c.id || uid(), type:'folder', name: c.name || 'Untitled',
          description: c.description || '', color: c.color || colors[1], children:
          (c.items||[]).map(function(i){
            return { id: i.id || uid(), type: childType, name: i.name || 'Untitled',
                     description:'', notes: i.notes || '', done: !!i.done,
                     qty: Number(i.qty)||1, price: Number(i.price)||0, url: i.url || '',
                     color: c.color || colors[1], children: [] };
          })
        };
      })
    };
  });
  return { updatedAt: Number(raw.updatedAt)||0, seeded: raw.seeded === true, nodes: nodes };
}
/* Fills in any missing fields so older or hand-edited data cannot crash a render. */
function normalize(s){
  function fix(n){
    n.id = n.id || uid();
    n.type = (n.type === 'part' || n.type === 'task') ? n.type : 'folder';
    n.name = n.name || 'Untitled';
    n.description = n.description || '';
    n.color = n.color || colors[0];
    n.children = Array.isArray(n.children) ? n.children : [];
    if (n.type !== 'folder'){ n.done = !!n.done; n.notes = n.notes || ''; }
    if (n.type === 'part'){ n.qty = Number(n.qty)||1; n.price = Number(n.price)||0; n.url = n.url || ''; }
    n.children.forEach(fix);
  }
  s.nodes = Array.isArray(s.nodes) ? s.nodes : [];
  s.nodes.forEach(fix);
  s.updatedAt = Number(s.updatedAt) || 0;
  return s;
}

function isPristine(s){ return !s || s.seeded === true; }
function loadLocal(){
  try {
    var raw = JSON.parse(localStorage.getItem(LOCAL_KEY));
    var m = migrate(raw);
    if (m) return m;
  } catch(e){}
  return seed();
}
function saveLocal(){ try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch(e){} }

/* ---------------------- local snapshot history ---------------------- */
function snapshots(){
  try { var l = JSON.parse(localStorage.getItem(SNAP_KEY)); return Array.isArray(l) ? l : []; } catch(e){ return []; }
}
function countAll(s){ var c = 0; (s.nodes||[]).forEach(function(n){ walk(n, function(){ c++; }); }); return c; }
function saveSnapshot(label, source){
  source = source || state;
  if (isPristine(source) || !(source.nodes||[]).length) return;
  var json = JSON.stringify(source.nodes);
  var list = snapshots();
  if (list[0] && list[0].json === json){
    if (label && label !== 'auto' && label !== 'edit' && list[0].label !== label){
      list[0].label = label;
      try { localStorage.setItem(SNAP_KEY, JSON.stringify(list)); } catch(e){}
    }
    return;
  }
  list.unshift({ at: Date.now(), label: label || 'auto', json: json,
                 projects: source.nodes.length, items: countAll(source) });
  list = list.slice(0, MAX_SNAPS);
  try { localStorage.setItem(SNAP_KEY, JSON.stringify(list)); } catch(e){}
}
function restoreSnapshot(idx){
  var s = snapshots()[idx];
  if (!s) return;
  if (!confirm('Restore the version from ' + new Date(s.at).toLocaleString() + '?\n\nThis replaces what is on screen now (the current version is saved as a snapshot first).')) return;
  saveSnapshot('before restore');
  state = normalize({ updatedAt: Date.now(), nodes: JSON.parse(s.json) });
  closeModal();
  route = { path: [] }; query = '';
  commit('Restored earlier version');
}

/* Single mutation entry point. */
function commit(msg){
  delete state.seeded;
  state.updatedAt = Date.now();
  saveLocal();
  saveSnapshot('edit');
  render();
  if (msg) toast(msg);
  queuePush();
}

/* ---------------------- cloud sync ---------------------- */
function setSync(cls, text){
  var bar = document.getElementById('syncbar');
  bar.className = 'syncbar ' + (cls || '');
  document.getElementById('syncText').textContent = text || '';
  bar.classList.toggle('hidden', !text);
}
async function initCloud(){
  if (!cloudEnabled){ setSync('warn','Local only - data stays in this browser.'); return; }
  if (!window.supabase){ setSync('err','Could not load the Supabase library - check your connection.'); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var res = await sb.auth.getSession();
  session = res.data.session;
  sb.auth.onAuthStateChange(function(_e, s){
    var oldId = session && session.user && session.user.id;
    var newId = s && s.user && s.user.id;
    session = s;
    if (oldId !== newId){
      if (s) afterSignIn();
      else { unsubscribe(); state = loadLocal(); route = { path: [] }; render(); }
    }
  });
  if (session) await afterSignIn(); else render();
}
async function afterSignIn(){ setSync('','Syncing...'); await pull(); subscribe(); render(); }

/* Reconciliation, in priority order:
   1. Cloud has data + this browser is pristine -> take cloud, never push.
   2. Cloud has data + local genuinely newer    -> keep local, push it.
   3. Cloud has data + cloud newer              -> take cloud.
   4. Cloud empty + local is real               -> push local.
   5. Cloud empty + local pristine              -> wait for a real edit. */
async function pull(){
  if (!session) return;
  pulling = true;
  try {
    var r = await sb.from('app_state').select('data').eq('user_id', session.user.id).maybeSingle();
    if (r.error) throw r.error;

    var local  = loadLocal();
    var remote = r.data && migrate(r.data.data);
    var remoteHasData = !!(remote && (remote.nodes||[]).length);
    var shouldPush = false;

    if (remoteHasData){
      saveSnapshot('from cloud', remote);
      if (isPristine(local)) state = remote;
      else if (Number(local.updatedAt||0) > Number(remote.updatedAt||0)){ state = local; shouldPush = true; }
      else state = remote;
    } else {
      state = local;
      shouldPush = !isPristine(local);
    }

    if (!nodeAt(route.path)) route = { path: [] };
    saveLocal();
    pulling = false;
    if (shouldPush) await push(true);
    setSync('ok','Synced as ' + session.user.email);
    setTimeout(function(){ if (session) setSync('',''); }, 2500);
  } catch(e){
    setSync('err','Sync error: ' + (e.message || e));
  }
  pulling = false;
}
function queuePush(){
  if (!session || pulling) return;
  setSync('','Saving...');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(function(){ push(false); }, 700);
}
async function push(quiet){
  if (!session) return;
  if (isPristine(state)) return;
  try {
    var r = await sb.from('app_state').upsert({
      user_id: session.user.id, data: state, updated_at: new Date().toISOString()
    }, { onConflict:'user_id' });
    if (r.error) throw r.error;
    if (!quiet){ setSync('ok','All changes saved'); setTimeout(function(){ if (session) setSync('',''); }, 1800); }
  } catch(e){
    setSync('err','Could not save to cloud: ' + (e.message || e));
  }
}
function subscribe(){
  unsubscribe();
  channel = sb.channel('app_state_sync').on('postgres_changes',
    { event:'*', schema:'public', table:'app_state', filter:'user_id=eq.' + session.user.id },
    function(payload){
      var remote = payload['new'] && migrate(payload['new'].data);
      if (remote && Number(remote.updatedAt||0) > Number(state.updatedAt||0)){
        saveSnapshot('before remote update');
        state = remote; saveLocal();
        if (!nodeAt(route.path)) route = { path: [] };
        render();
        setSync('ok','Updated from another device');
        setTimeout(function(){ if (session) setSync('',''); }, 2200);
      }
    }).subscribe();
}
function unsubscribe(){ if (channel && sb){ sb.removeChannel(channel); channel = null; } }

/* ---------------------- auth ---------------------- */
function authView(){
  return '<div class="auth-wrap"><div class="auth-card">' +
    '<span class="logo" style="width:44px;height:44px;font-size:20px">&#9670;</span>' +
    '<h1>Project Cards</h1><p class="sub">Sign in so your projects follow you across every browser and device.</p>' +
    '<div class="auth-tabs">' +
      '<button class="' + (authTab==='signin'?'active':'') + '" onclick="authTab=\'signin\';render()">Sign in</button>' +
      '<button class="' + (authTab==='signup'?'active':'') + '" onclick="authTab=\'signup\';render()">Create account</button>' +
    '</div>' +
    '<div class="field full"><label>Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>' +
    '<div class="field full" style="margin-top:12px"><label>Password</label><input id="authPass" type="password" placeholder="At least 6 characters" onkeydown="if(event.key===\'Enter\')doAuth()"></div>' +
    '<button class="btn block" style="margin-top:18px" onclick="doAuth()">' + (authTab==='signin'?'Sign in':'Create account') + '</button>' +
    '<p class="note">Signing in pulls your projects down from the cloud. Your data is stored under your own account and is not visible to anyone else.</p>' +
    '</div></div>';
}
async function doAuth(){
  var email = document.getElementById('authEmail').value.trim();
  var pass  = document.getElementById('authPass').value;
  if (!email || !pass) return toast('Enter an email and password');
  try {
    var r = authTab === 'signin'
      ? await sb.auth.signInWithPassword({ email: email, password: pass })
      : await sb.auth.signUp({ email: email, password: pass });
    if (r.error) throw r.error;
    if (authTab === 'signup' && !r.data.session) toast('Check your email to confirm the account, then sign in.');
  } catch(e){ toast(e.message || 'Sign in failed'); }
}
function openAccountModal(){
  var who = session ? esc(session.user.email) : 'Not signed in';
  modal('<div class="modal-head"><h2>Account</h2><button class="icon-btn" onclick="closeModal()">&times;</button></div>' +
    '<p class="note" style="margin-top:0">' + (cloudEnabled ? 'Signed in as <strong>' + who + '</strong>' : 'Local-only mode') + '</p>' +
    '<button class="btn secondary block" style="margin-top:14px" onclick="openHistoryModal()">Version history (' + snapshots().length + ')</button>' +
    '<button class="btn secondary block" style="margin-top:9px" onclick="exportData()">Download a backup file</button>' +
    (session ? '<button class="btn secondary block" style="margin-top:9px" onclick="forcePull()">Refresh from cloud</button>' +
               '<div class="danger-zone"><button class="btn danger small" onclick="signOut()">Sign out</button></div>' : '') +
    '<div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>');
}
function openHistoryModal(){
  var list = snapshots();
  var body = list.length ? '<div class="snaps">' + list.map(function(s, i){
      return '<div class="snap"><div class="snap-info">' +
        '<div class="snap-when">' + esc(new Date(s.at).toLocaleString()) + '</div>' +
        '<div class="snap-meta">' + s.projects + ' top-level, ' + s.items + ' cards total &middot; <span class="snap-tag">' + esc(s.label) + '</span></div>' +
        '</div><button class="btn small" onclick="restoreSnapshot(' + i + ')">Restore</button></div>';
    }).join('') + '</div>'

    '<div class="modal-actions"><button class="btn secondary" onclick="openAccountModal()">Back</button>' +
    '<button class="btn" onclick="closeModal()">Close</button></div>');
}
async function forcePull(){ closeModal(); await pull(); render(); toast('Refreshed'); }
async function signOut(){ closeModal(); unsubscribe(); await sb.auth.signOut(); session = null; state = loadLocal(); route = { path: [] }; render(); }

/* ---------------------- routing ---------------------- */
function goHome(){ route = { path: [] }; query = ''; itemFilter = 'all'; render(); window.scrollTo(0,0); }
function openNode(id){
  route = { path: route.path.concat([id]) };
  query = ''; itemFilter = 'all'; render(); window.scrollTo(0,0);
}
function goToPath(path){
  route = { path: path.slice() };
  query = ''; itemFilter = 'all'; render(); window.scrollTo(0,0);
}
function goUp(){ goToPath(route.path.slice(0, -1)); }

/* Full re-render, preserving search focus and caret so a background
   cloud sync can never yank the keyboard away mid-typing. */
function render(){
  var main = document.getElementById('main');
  var active = document.activeElement;
  var hadFocus = active && active.id === 'searchInput';
  var caret = hadFocus ? active.selectionStart : null;

  var needsAuth = cloudEnabled && !session;
  document.getElementById('accountBtn').innerHTML = session ? '&#9679;' : '&#9675;';
  var tools = document.querySelectorAll('.topbar .btn, .topbar .icon-btn, .topbar .brand');
  for (var k = 0; k < tools.length; k++){
    if (tools[k].id !== 'accountBtn') tools[k].classList.toggle('hidden', needsAuth);
  }
  if (needsAuth){ main.innerHTML = authView(); return; }

  if (!nodeAt(route.path)) route = { path: [] };
  var node = current();
  document.getElementById('topAddLabel').textContent = route.path.length ? 'New card' : 'New project';
  document.getElementById('homeBtn').classList.toggle('hidden', route.path.length === 0);
  main.innerHTML = nodeView(node);

  if (hadFocus){
    var el = document.getElementById('searchInput');
    if (el){ el.focus(); try { el.setSelectionRange(caret, caret); } catch(e){} }
  }
}

/* Typing only swaps #results; the input element is never re-created. */
function onSearch(value){ query = value; renderResults(); }
function onItemFilter(value){ itemFilter = value; renderResults(); }
function renderResults(){
  var el = document.getElementById('results');
  if (el) el.innerHTML = childrenHTML(current());
}

/* ---------------------- the one and only view ---------------------- */
function nodeView(node){
  var st = leafStats(node);
  var isRoot = !!node.root;
  var hasParts = st.parts > 0;
  var typeWord = isRoot ? 'Dashboard' : node.type === 'part' ? 'Part' : node.type === 'task' ? 'Task' : 'List';

  var html = breadcrumbHTML();

  html += '<div class="hero"><div><div class="eyebrow">' + typeWord + '</div>' +
    '<h1>' + esc(isRoot ? 'Your projects' : node.name) + '</h1>' +
    '<p>' + esc(node.description || (isRoot
      ? 'Every card can hold more cards, so you can nest lists as deep as you need.'
      : 'Open a card to go deeper, or add sub-items and parts below.')) + '</p></div>' +
    '<div class="hero-actions">' +
    (isRoot ? '' : '<button class="btn secondary" onclick="openNodeModal(\'' + node.id + '\')">Edit this card</button>') +
    '<button class="btn" onclick="openNodeModal(null)">&#65291; Add card</button></div></div>';

  html += statBlock([
    [kids(node).length, isRoot ? 'Projects' : 'Cards'],
    [st.total, 'Items'],
    [st.done, 'Done'],
    [hasParts ? money(st.cost) : st.pct + '%', hasParts ? 'Cost' : 'Progress']
  ]);

  if (!isRoot && node.type !== 'folder') html += detailPanel(node);

  html += '<div class="toolbar"><div class="search">' +
    '<input id="searchInput" type="search" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" ' +
    'placeholder="Search in ' + esc(isRoot ? 'projects' : node.name) + '..." value="' + esc(query) + '" oninput="onSearch(this.value)"></div>' +
    '<select onchange="onItemFilter(this.value)">' +
    '<option value="all"' + (itemFilter==='all'?' selected':'') + '>All</option>' +
    '<option value="open"' + (itemFilter==='open'?' selected':'') + '>Open</option>' +
    '<option value="done"' + (itemFilter==='done'?' selected':'') + '>Completed</option></select></div>';

  html += '<div id="results">' + childrenHTML(node) + '</div>';
  return html;
}

/* Details for a leaf card you have drilled into. */
function detailPanel(node){
  var bits = [];
  if (isPart(node)){
    bits.push('<span class="metric"><strong>' + (Number(node.qty)||1) + '</strong> qty</span>');
    bits.push('<span class="metric"><strong>' + money(node.price) + '</strong> each</span>');
    bits.push('<span class="metric"><strong>' + money(lineTotal(node)) + '</strong> line total</span>');
    var u = safeUrl(node.url);
    if (u) bits.push('<span class="metric">&#128279; <a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(hostOf(u)) + '</a></span>');
  }
  bits.push('<span class="metric">' + (node.done ? '&#10003; Completed' : 'Not completed') + '</span>');
  return '<div class="card" style="--accent:' + esc(node.color) + ';cursor:default;margin-bottom:20px">' +
    '<div class="card-head"><div class="card-icon">' + typeIcon(node) + '</div>' +
    '<div><h3 class="card-title">' + esc(node.name) + '</h3>' +
    '<p class="desc">' + esc(node.notes || 'No notes') + '</p></div>' +
    '<button class="menu" title="Edit" onclick="openNodeModal(\'' + node.id + '\')">&#8943;</button></div>' +
    '<div class="metrics">' + bits.join('') + '</div></div>';
}

/* Children render as cards (folders) plus rows (tasks and parts). */
function childrenHTML(node){
  var q = query.toLowerCase();
  var list = kids(node).filter(function(c){
    if (q && c.name.toLowerCase().indexOf(q) === -1) return false;
    if (itemFilter === 'all' || isFolder(c)) return true;
    return itemFilter === 'done' ? !!c.done : !c.done;
  });
  if (!list.length){
    var filtering = !!q || itemFilter !== 'all';
    return '<div class="empty"><div class="empty-icon">' + (filtering ? '&#9788;' : '&#9638;') + '</div>' +
      '<h3>' + (filtering ? 'No matches' : 'Nothing here yet') + '</h3>' +
      '<p>' + (filtering ? 'Nothing matches the current search or filter.'
        : 'Add a list, a task or a part. Each one can hold more cards inside it.') + '</p>' +
      '<button class="btn" onclick="openNodeModal(null)">Add a card</button></div>';
  }
  var folders = list.filter(isFolder);
  var leaves  = list.filter(function(c){ return !isFolder(c); });
  var out = '';
  if (folders.length){
    if (leaves.length) out += '<div class="section-label">Lists</div>';
    out += '<div class="grid">' + folders.map(folderCard).join('') + '</div>';
  }
  if (leaves.length){
    if (folders.length) out += '<div class="section-label">Items</div>';
    out += '<div class="list">' + leaves.map(leafRow).join('') + '</div>';
  }
  return out;
}

function typeIcon(n){ return isFolder(n) ? '&#9638;' : isPart(n) ? '&#128722;' : '&#10003;'; }

function folderCard(n){
  var st = leafStats(n);
  return '<article class="card" style="--accent:' + esc(n.color) + '" onclick="openNode(\'' + n.id + '\')">' +
    '<div class="card-head"><div class="card-icon">&#9638;</div>' +
    '<div><h3 class="card-title">' + esc(n.name) + '</h3>' +
    '<p class="desc">' + esc(n.description || 'No description') + '</p></div>' +
    '<button class="menu" title="Edit" onclick="event.stopPropagation();openNodeModal(\'' + n.id + '\')">&#8943;</button></div>' +
    '<div class="progress-row"><span>Progress</span><strong>' + st.pct + '%</strong></div>' +
    '<div class="progress"><span style="width:' + st.pct + '%"></span></div>' +
    '<div class="metrics"><span class="metric"><strong>' + kids(n).length + '</strong> cards</span>' +
    '<span class="metric"><strong>' + st.open + '</strong> open</span>' +
    (st.parts ? '<span class="metric"><strong>' + money(st.cost) + '</strong> parts</span>' : '') +
    '</div></article>';
}

function leafRow(n){
  var childCount = descendantCount(n);
  var st = leafStats(n);
  var u = isPart(n) ? safeUrl(n.url) : '';
  var meta = [];
  if (isPart(n)){
    meta.push('<span>Qty: ' + (Number(n.qty)||1) + '</span>');
    meta.push('<span>Unit: ' + money(n.price) + '</span>');
  }
  if (childCount) meta.push('<span class="pill">' + childCount + ' inside &middot; ' + st.pct + '%</span>');
  if (n.notes) meta.push('<span>' + esc(n.notes) + '</span>');
  if (u) meta.push('<span>&#128279; ' + esc(hostOf(u)) + '</span>');

  return '<div class="item ' + (n.done ? 'done ' : '') + (childCount ? 'has-kids' : '') + '" style="--accent:' + esc(n.color) + '">' +
    '<input class="check" type="checkbox" ' + (n.done ? 'checked' : '') + ' onchange="toggleDone(\'' + n.id + '\')" title="Mark complete">' +
    '<div class="item-main" onclick="openNode(\'' + n.id + '\')" title="Open">' +
      '<div class="item-title">' + typeIcon(n) + ' ' + esc(n.name) + '</div>' +
      (meta.length ? '<div class="item-meta">' + meta.join('') + '</div>' : '') +
    '</div>' +
    '<div class="item-actions">' +
      (isPart(n) ? '<div class="price">' + money(lineTotal(n)) + '</div>' : '') +
      (u ? '<a class="linkbtn" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer" title="Open link" onclick="event.stopPropagation()">&#128279;</a>' : '') +
      '<button class="icon-btn" title="Edit" onclick="openNodeModal(\'' + n.id + '\')">&#9998;</button>' +
    '</div></div>';
}

function breadcrumbHTML(){
  var t = trail();
  var out = '<div class="breadcrumb"><button class="crumb" onclick="goHome()">&#8962; Home</button>';
  var shown = t;
  if (t.length > 3){
    out += '<span>&rsaquo;</span><span>&hellip;</span>';
    shown = t.slice(-2);
  }
  shown.forEach(function(step, i){
    var last = (i === shown.length - 1);
    out += '<span>&rsaquo;</span>' + (last
      ? '<span class="crumb here">' + esc(step.node.name) + '</span>'
      : '<button class="crumb" onclick="goToPath([' + step.path.map(function(id){ return "'" + id + "'"; }).join(',') + '])">' + esc(step.node.name) + '</button>');
  });
  return out + '</div>';
}

function statBlock(rows){
  return '<div class="stats">' + rows.map(function(r){
    return '<div class="stat"><div class="n">' + r[0] + '</div><div class="l">' + r[1] + '</div></div>'; }).join('') + '</div>';
}

/* ---------------------- modals ---------------------- */
function modal(html){ document.getElementById('modal').innerHTML = html; document.getElementById('modalBackdrop').classList.add('open'); }
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('open'); }
function backdropClose(e){ if (e.target.id === 'modalBackdrop') closeModal(); }
function colorPicker(sel){
  return '<div class="accent-picker">' + colors.map(function(x){
    return '<span class="accent-dot ' + (x === sel ? 'selected' : '') + '" style="background:' + x + '" onclick="pickColor(this,\'' + x + '\')"></span>';
  }).join('') + '</div><input type="hidden" id="color" value="' + sel + '">';
}
function pickColor(el, c){
  var dots = document.querySelectorAll('.accent-dot');
  for (var k = 0; k < dots.length; k++) dots[k].classList.remove('selected');
  el.classList.add('selected');
  document.getElementById('color').value = c;
}
function pickType(t){
  document.getElementById('nodeType').value = t;
  ['folder','task','part'].forEach(function(x){
    document.getElementById('tp_' + x).classList.toggle('on', x === t);
  });
  document.getElementById('partFields').classList.toggle('hidden', t !== 'part');
  document.getElementById('doneField').classList.toggle('hidden', t === 'folder');
}

/* One modal creates and edits every kind of card. */
function openNodeModal(id, presetType){
  var editing = null;
  if (id){
    var found = null;
    (state.nodes||[]).forEach(function(root){ walk(root, function(x){ if (x.id === id) found = x; }); });
    editing = found;
  }
  var n = editing || { type: presetType || (route.path.length ? 'task' : 'folder'),
                       name:'', description:'', notes:'', color: colors[route.path.length % colors.length],
                       qty:1, price:0, url:'', done:false };
  var where = editing ? '' : (route.path.length ? esc(current().name) : 'your dashboard');

  modal('<div class="modal-head"><h2>' + (editing ? 'Edit card' : 'New card') + '</h2>' +
    '<button class="icon-btn" onclick="closeModal()">&times;</button></div>' +
    (editing ? '' : '<p class="hint" style="margin:-8px 0 14px">Adding inside <strong>' + where + '</strong></p>') +
    '<div class="field full"><label>What is this card?</label><div class="typepick">' +
      '<button id="tp_folder" class="' + (n.type==='folder'?'on':'') + '" onclick="pickType(\'folder\')"><span class="ic">&#9638;</span>List</button>' +
      '<button id="tp_task" class="' + (n.type==='task'?'on':'') + '" onclick="pickType(\'task\')"><span class="ic">&#10003;</span>Task</button>' +
      '<button id="tp_part" class="' + (n.type==='part'?'on':'') + '" onclick="pickType(\'part\')"><span class="ic">&#128722;</span>Part</button>' +
    '</div><input type="hidden" id="nodeType" value="' + n.type + '">' +
    '<div class="hint">Any card can hold more cards inside it, however deep you need.</div></div>' +
    '<div class="form-grid" style="margin-top:14px">' +
      '<div class="field full"><label>Name</label><input id="name" value="' + esc(n.name) + '" placeholder="Example: Conveyor upgrade"></div>' +
      '<div class="field full"><label>Description</label><textarea id="description">' + esc(n.description) + '</textarea></div>' +
      '<div class="field full ' + (n.type === 'part' ? '' : 'hidden') + '" id="partFields"><div class="form-grid">' +
        '<div class="field"><label>Quantity</label><input id="qty" type="number" min="0" step="1" value="' + (n.qty || 1) + '"></div>' +
        '<div class="field"><label>Unit price</label><input id="price" type="number" min="0" step="0.01" value="' + (n.price || 0) + '"></div>' +
        '<div class="field full"><label>Product URL</label>' +
          '<input id="url" type="url" inputmode="url" autocapitalize="none" spellcheck="false" placeholder="https://www.mcmaster.com/..." value="' + esc(n.url || '') + '">' +
          '<div class="hint">Where to buy it. Opens in a new tab from the parts list.</div></div>' +
      '</div></div>' +
      '<div class="field full"><label>Notes</label><textarea id="notes">' + esc(n.notes || '') + '</textarea></div>' +
      '<div class="field full"><label>Card color</label>' + colorPicker(n.color) + '</div>' +
      '<div class="field full ' + (n.type === 'folder' ? 'hidden' : '') + '" id="doneField"><label>' +
        '<input id="done" type="checkbox" ' + (n.done ? 'checked' : '') + '> Completed / purchased</label></div>' +
    '</div>' +
    (editing ? '<div class="danger-zone"><button class="btn danger small" onclick="deleteNode(\'' + id + '\')">Delete this card' +
      (descendantCount(editing) ? ' and the ' + descendantCount(editing) + ' inside it' : '') + '</button></div>' : '') +
    '<div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button>' +
    '<button class="btn" onclick="saveNode(\'' + (id || '') + '\')">Save card</button></div>');
  document.getElementById('name').focus();
}

function saveNode(id){
  var name = document.getElementById('name').value.trim();
  if (!name) return toast('Give the card a name');
  var type = document.getElementById('nodeType').value;
  var data = {
    type: type,
    name: name,
    description: document.getElementById('description').value.trim(),
    notes: document.getElementById('notes').value.trim(),
    color: document.getElementById('color').value
  };
  if (type !== 'folder') data.done = document.getElementById('done').checked;
  if (type === 'part'){
    data.qty   = Number(document.getElementById('qty').value) || 1;
    data.price = Number(document.getElementById('price').value) || 0;
    data.url   = document.getElementById('url').value.trim();
  }
  if (id){
    var target = null;
    (state.nodes||[]).forEach(function(root){ walk(root, function(x){ if (x.id === id) target = x; }); });
    if (!target) return toast('That card no longer exists');
    Object.assign(target, data);
  } else {
    current().children.push(Object.assign({ id: uid(), created: Date.now(), children: [] }, data));
  }
  closeModal();
  commit('Card saved');
}

function toggleDone(id){
  var target = null;
  (state.nodes||[]).forEach(function(root){ walk(root, function(x){ if (x.id === id) target = x; }); });
  if (!target) return;
  target.done = !target.done;
  commit();
}

function deleteNode(id){
  var target = null;
  (state.nodes||[]).forEach(function(root){ walk(root, function(x){ if (x.id === id) target = x; }); });
  if (!target) return;
  var inside = descendantCount(target);
  if (!confirm('Delete "' + target.name + '"' + (inside ? ' and the ' + inside + ' card(s) inside it' : '') + '?')) return;
  saveSnapshot('before delete');
  var parent = findParentOf(id);
  if (!parent) return;
  parent.children = parent.children.filter(function(c){ return c.id !== id; });
  closeModal();
  // If the open card was just deleted, step back up to its parent.
  if (route.path.indexOf(id) > -1) route = { path: route.path.slice(0, route.path.indexOf(id)) };
  query = '';
  commit('Card deleted');
}

/* ---------------------- backup + boot ---------------------- */
function exportData(){
  var blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'project-cards-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(a.href); toast('Backup exported');
}
function importData(e){
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var incoming = migrate(JSON.parse(r.result));
      if (!incoming || !incoming.nodes.length) throw new Error('bad file');
      saveSnapshot('before import');
      state = normalize({ updatedAt: Date.now(), nodes: incoming.nodes });
      route = { path: [] }; query = '';
      commit('Backup imported');
    } catch(err){ toast('That file is not a valid backup'); }
  };
  r.readAsText(f); e.target.value = '';
}
var toastTimer;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    if (document.getElementById('modalBackdrop').className.indexOf('open') > -1) closeModal();
    else if (route.path.length) goUp();
  }
});
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && session) pull().then(render);
});
state = loadLocal();
/* Baseline snapshot of whatever this browser opened with, so the very
   first edit of a session already has a version to roll back to. */
saveSnapshot('opened');
render();
initCloud();
</script>
</body>
